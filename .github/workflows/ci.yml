name: CampusShare CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-test:
    name: Backend Node.js Sözdizimi ve Bağımlılık Doğrulama
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Node.js 20 Kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Bağımlılıkları Kur
        run: |
          cd backend
          npm install

      - name: JavaScript Sözdizimi Kontrolleri
        run: |
          cd backend
          node --check src/server.js
          node --check src/db.js
          node --check src/routes/auth.js
          node --check src/routes/listings.js
          node --check src/routes/messages.js
          node --check src/middleware/auth.js

  docker-test:
    name: Docker & Nginx Yapılandırma Doğrulama
    runs-on: ubuntu-latest

    steps:
      - name: Kodu Klonla
        uses: actions/checkout@v4

      - name: Docker Compose Yapılandırma Sözdizimi Kontrolü
        run: |
          docker compose config

      - name: Backend Docker Image Build Testi
        run: |
          docker build -t campusshare-backend-test ./backend
