<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusShare — Giriş / Kayıt</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-indigo-50 to-blue-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
    <header class="text-center mb-6">
      <h1 class="text-3xl font-bold text-indigo-600">CampusShare</h1>
      <p class="text-gray-500 text-sm mt-1">Üniversite öğrencileri için ikinci el pazarı</p>
    </header>

    <!-- Sekmeler -->
    <div class="flex mb-6 bg-gray-100 rounded-lg p-1" role="tablist">
      <button id="tab-login" type="button" class="flex-1 py-2 rounded-md text-sm font-medium bg-white shadow text-indigo-600">Giriş Yap</button>
      <button id="tab-register" type="button" class="flex-1 py-2 rounded-md text-sm font-medium text-gray-500">Kayıt Ol</button>
    </div>

    <div id="message" class="hidden mb-4 p-3 rounded-lg text-sm" role="alert"></div>

    <!-- Giriş formu -->
    <form id="login-form" class="space-y-4" novalidate>
      <div>
        <label for="login-email" class="block text-sm font-medium text-gray-700 mb-1">Üniversite E-postası</label>
        <input id="login-email" type="email" placeholder="ad.soyad@universite.edu.tr" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div>
        <label for="login-password" class="block text-sm font-medium text-gray-700 mb-1">Şifre</label>
        <input id="login-password" type="password" placeholder="••••••••" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition">Giriş Yap</button>
    </form>

    <!-- Kayıt formu -->
    <form id="register-form" class="space-y-4 hidden" novalidate>
      <div>
        <label for="reg-name" class="block text-sm font-medium text-gray-700 mb-1">Ad Soyad</label>
        <input id="reg-name" type="text" placeholder="Ad Soyad" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div>
        <label for="reg-email" class="block text-sm font-medium text-gray-700 mb-1">Üniversite E-postası</label>
        <input id="reg-email" type="email" placeholder="ad.soyad@universite.edu.tr" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
        <p class="text-xs text-gray-400 mt-1">Yalnızca <span class="font-semibold">.edu.tr</span> uzantılı adresler kabul edilir.</p>
      </div>
      <div>
        <label for="reg-password" class="block text-sm font-medium text-gray-700 mb-1">Şifre</label>
        <input id="reg-password" type="password" placeholder="En az 8 karakter" required minlength="8"
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <div>
        <label for="reg-password2" class="block text-sm font-medium text-gray-700 mb-1">Şifre (Tekrar)</label>
        <input id="reg-password2" type="password" placeholder="Şifreyi tekrar girin" required
               class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none">
      </div>
      <button type="submit" class="w-full py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition">Kayıt Ol</button>
    </form>
  </main>

  <script>
    // Hafta 1: yalnızca arayüz ve istemci tarafı doğrulama.
    // API bağlantısı (/api/auth/*) Hafta 2'de eklenecek.
    const EDU_TR = /^[^\s@]+@[^\s@]+\.edu\.tr$/i;

    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const loginForm = document.getElementById('login-form');
    const registerForm = document.getElementById('register-form');
    const box = document.getElementById('message');

    function showMessage(text, ok) {
      box.textContent = text;
      box.className = 'mb-4 p-3 rounded-lg text-sm ' +
        (ok ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700');
    }

    function switchTab(login) {
      loginForm.classList.toggle('hidden', !login);
      registerForm.classList.toggle('hidden', login);
      const active = 'flex-1 py-2 rounded-md text-sm font-medium bg-white shadow text-indigo-600';
      const idle = 'flex-1 py-2 rounded-md text-sm font-medium text-gray-500';
      tabLogin.className = login ? active : idle;
      tabRegister.className = login ? idle : active;
      box.className = 'hidden';
    }

    tabLogin.addEventListener('click', () => switchTab(true));
    tabRegister.addEventListener('click', () => switchTab(false));

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      if (!EDU_TR.test(email)) return showMessage('Lütfen geçerli bir .edu.tr e-posta adresi girin.', false);
      if (!password) return showMessage('Şifre boş bırakılamaz.', false);
      showMessage('Giriş doğrulandı (backend bağlantısı Hafta 2\'de eklenecek).', true);
    });

    registerForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const p1 = document.getElementById('reg-password').value;
      const p2 = document.getElementById('reg-password2').value;
      if (!name) return showMessage('Ad Soyad boş bırakılamaz.', false);
      if (!EDU_TR.test(email)) return showMessage('Yalnızca .edu.tr uzantılı e-posta ile kayıt olunabilir.', false);
      if (p1.length < 8) return showMessage('Şifre en az 8 karakter olmalıdır.', false);
      if (p1 !== p2) return showMessage('Şifreler eşleşmiyor.', false);
      showMessage('Kayıt bilgileri geçerli (backend bağlantısı Hafta 2\'de eklenecek).', true);
    });
  </script>
</body>
</html>
